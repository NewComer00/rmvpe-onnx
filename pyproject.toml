[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "rmvpe-onnx"
version     = "0.2.1"
description = "RMVPE pitch estimator — pure ONNX Runtime inference"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy >= 1.22, < 2.3; python_version < '3.11'",
    "numpy >= 1.23; python_version >= '3.11'",
    "scipy >= 1.15",
    "librosa >= 0.11",
    "huggingface_hub >= 1.9",
    "onnxruntime >= 1.24; python_version >= '3.11'",
    "onnxruntime >= 1.19, < 1.24; python_version < '3.11'",
]

[project.urls]
Documentation = "https://NewComer00.github.io/rmvpe-onnx/"
Source = "https://github.com/NewComer00/rmvpe-onnx"

[project.optional-dependencies]
cli = [
    "soundfile >= 0.13",
    "plotly >= 6.6",
]
dev = [
    "rmvpe-onnx[cli]",

    # testing
    "pytest >= 9.0",
    "pytest-cov >= 7.1",
    "tox >= 4.22",
    "tox-uv >= 1.34",
    "tox-gh >= 1.4",

    # linting
    "ruff >= 0.15",

    # releasing
    "python-semantic-release >= 10.5",
    "build >= 1.4",

    # packaging
    "pyinstaller >= 6.19",

    # docs
    "sphinx >= 8.1",
    "sphinx-autodoc-typehints >= 3.0",
    "sphinx-argparse >= 0.5",
    "sphinx-autobuild >= 2024.10",
    "furo >= 2025.12",
]

[project.scripts]
rmvpe-onnx = "rmvpe_onnx.cli:main"

[project.entry-points."pyinstaller40"]
hook-dirs = "rmvpe_onnx.PyInstaller:get_hook_dirs"

[tool.hatch.build.targets.wheel]
packages  = ["src/rmvpe_onnx"]
artifacts = ["src/rmvpe_onnx/data/*.onnx"]

[tool.ruff]
target-version = "py310"
line-length    = 128

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "D",   # pydocstyle
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "C90", # mcCabe complexity
]
ignore = [
    "SIM117",  # allow nested `with` statements
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",   # allow assert statements in tests
    "D",      # ignore docstring issues in tests
]
"src/rmvpe_onnx/PyInstaller/*" = [
    "D",      # ignore docstring issues in PyInstaller hooks
]
"src/rmvpe_onnx/cli.py" = [
    "D",      # ignore docstring issues in CLI
]
"docs/source/conf.py" = [
    "D",      # ignore docstring issues in Sphinx config
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style              = "double"
indent-style             = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths     = ["tests", "src/rmvpe_onnx"]
addopts       = [
    "-ra",
    "-v",
    "--doctest-modules",
    "--cov=rmvpe_onnx",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.coverage.run]
source   = ["src/rmvpe_onnx"]
omit     = [
    "src/rmvpe_onnx/PyInstaller/*",
]

[tool.coverage.report]
show_missing  = true
skip_covered  = false
fail_under    = 85

[tool.tox]
env_list = ["lint", "docs", "py310", "py311", "py312", "py313", "py314"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
extras = ["dev"]
commands = [["pytest", "{posargs}"]]

[tool.tox.env.lint]
base_python = "py310"
extras = ["dev"]
commands = [
    ["ruff", "check"],
]

[tool.tox.env.docs]
base_python = "py310"
extras = ["dev"]
commands = [
    ["sphinx-build", "-W", "docs/source", "docs/build/html"]
]

[tool.tox.gh.python]
"3.10" = ["py310"]
"3.11" = ["py311"]
"3.12" = ["py312"]
"3.13" = ["py313"]
"3.14" = ["py314"]

[tool.semantic_release]
commit_parser = "conventional"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/rmvpe_onnx/__init__.py:__version__"]
tag_format = "v{version}"
major_on_zero = false  # TODO: set to true after the first stable release
allow_zero_version = true

[tool.semantic_release.branches.main]
match = "(main|master)"

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
other_allowed_tags = ["build", "chore", "ci", "docs", "style", "refactor", "test"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.remote]
type = "github"
token = { env = "GITHUB_TOKEN" }
ignore_token_for_push = true  # See https://github.com/dxvidparham/psr-deploy-keys-for-protected-branches

[tool.semantic_release.publish]
upload_to_vcs_release = false  # Assets will be built and published in a separate workflow
dist_glob_patterns = []
